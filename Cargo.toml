[workspace]
members = [
    "components/api-server",
    "components/clp-rust-utils",
    "components/clp-tdl-package",
    "components/compression-coordinator",
    "components/log-ingestor",
    "components/query-coordinator"
]
resolver = "3"

[workspace.package]
version = "0.13.1-dev"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
aws-config = "1.10.1"
aws-sdk-s3 = "1.141.0"
aws-sdk-sqs = "1.105.0"
axum = { version = "0.8.9", features = ["json"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
clp-rust-utils = { path = "components/clp-rust-utils" }
const_format = "0.2.36"
futures = "0.3.33"
http-body-util = "0.1.4"
mongodb = "3.8.0"
non-empty-string = { version = "0.2.6", features = ["serde"] }
num_enum = "0.7.6"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["metrics", "http-proto"] }
opentelemetry_sdk = { version = "0.32.1", features = ["metrics", "rt-tokio"] }
pin-project-lite = "0.2.17"
regex = "1.13.1"
rmp-serde = "1.3.1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serial_test = "4.0.1"
spider-client = { git = "https://github.com/y-scope/spider.git", tag = "v0.1.0-rc.1-huntsman" }
spider-core = { git = "https://github.com/y-scope/spider.git", tag = "v0.1.0-rc.1-huntsman" }
spider-tdl = { git = "https://github.com/y-scope/spider.git", tag = "v0.1.0-rc.1-huntsman", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "mysql"] }
strsim = "0.11.1"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
tokio-util = "0.7.19"
tonic = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "std"] }
url = "2.5.8"
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
uuid = { version = "1.24.0", features = ["v4"] }
yaml_serde = "0.10.4"
zstd = "0.13.3"
