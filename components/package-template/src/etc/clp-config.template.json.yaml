#  port: 3306
#  names:
#    clp: "clp-db"
#
#compression_scheduler:
#  jobs_poll_delay: 0.1  # seconds
#  max_concurrent_tasks_per_job: 0  # A value of 0 disables the limit
#  logging_level: "INFO"
#  telemetry_update_interval_ms: 60000
