## Spider config. Only used when `package.scheduler` is "spider", in which case this block and
## `compression_coordinator` below are both required.
## `host` and `port` locate Spider's storage service for compression-coordinator; the deployment
## rewrites `host` to Spider's in-deployment service name.
## The `storage`, `scheduler`, and `worker` blocks configure Spider's own services in the Docker
## Compose deployment. They have no effect in a Helm deployment, where Spider is configured
## through its subchart. Any field left unset keeps Spider's own default, shown below.
