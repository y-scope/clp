[package]
name = "query-result-listener"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "query_result_listener"
path = "src/lib.rs"

[features]
test-utils = []

[dependencies]
async-stream = { workspace = true }
bytes = { workspace = true }
clp-rust-utils = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
non-empty-string = { workspace = true }
rmp = { workspace = true }
spider-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
query-result-listener = { path = ".", features = ["test-utils"] }
