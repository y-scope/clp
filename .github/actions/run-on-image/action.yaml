name: "run-on-image"
description: "Runs a command inside a downloaded/published container image with the repo mounted"

inputs:
  image_name:
    description: "Name of the container image (without registry or repository) to use"
    required: true
  use_published_image:
    description: "Whether to use the published container image"
    required: true
  run_command:
    description: "Command to execute"
    required: true
  arch:
    description: >-
      Target architecture (e.g. "amd64" or "arm64") when consuming a single arch of a
      multi-arch image. When set and using a published image, the bare multi-arch tag ":main" is
      pulled for that platform. When set and using a locally-built image, the arch-suffixed
      artifact/image (e.g. "<image_name>-amd64") produced by clp-core-build-containers is loaded.
      When empty, the bare image_name is used (legacy behaviour).
    required: false
    default: ""
  prepared_image_id:
    description: >-
      Immutable image ID returned by prepare-image. When set, the image is already available in the
      local Docker daemon and won't be pulled or loaded again.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - if: "inputs.prepared_image_id == ''"
      id: "prepare_image"
      uses: "./.github/actions/prepare-image"
      with:
        image_name: "${{inputs.image_name}}"
        use_published_image: "${{inputs.use_published_image}}"
        arch: "${{inputs.arch}}"

    - id: "select_image"
      env:
        INPUT_IMAGE_ID: "${{inputs.prepared_image_id}}"
        PREPARED_IMAGE_ID: "${{steps.prepare_image.outputs.image_id}}"
      run: |
        image_id="${INPUT_IMAGE_ID:-${PREPARED_IMAGE_ID}}"
        if [[ ! "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::run-on-image: invalid prepared image ID '${image_id}'" >&2
          exit 1
        fi
        if ! docker image inspect "${image_id}" >/dev/null; then
          echo "::error::run-on-image: prepared image '${image_id}' is not available" >&2
          exit 1
        fi
        echo "image_id=${image_id}" >> "$GITHUB_OUTPUT"
      shell: "bash"

    - run: "./tools/scripts/deps-download/init.sh"
      shell: "bash"

    # `--env npm_config_cache` overrides the default `/.npm` to avoid permission issues.
    - run: >-
        docker run
        --user $(id -u):$(id -g)
        --volume "$GITHUB_WORKSPACE":/mnt/repo
        --workdir /mnt/repo
        ${{steps.select_image.outputs.image_id}}
        bash -c "${{inputs.run_command}}"
      shell: "bash"
