name: "deps-cache-key"
description: >-
  Computes the `actions/cache` key for the C++ dependency artifacts produced by `task deps:core`.

inputs:
  os_name:
    description: "Name of the OS whose build environment produced the dependency artifacts."
    required: true
  arch:
    description: "Target architecture the artifacts are built for."
    required: false
    default: "x86_64"
  env_hash:
    description: >-
      SHA-256 identity of the build environment. Linux callers pass the resolved platform image ID;
      macOS callers hash the installed compiler and Homebrew toolchain.
    required: true

outputs:
  key:
    description: "Cache key identifying the exact build environment and dependency definitions."
    value: "${{steps.compute.outputs.key}}"

runs:
  using: "composite"
  steps:
    - id: "compute"
      shell: "bash"

      # The key identifies the dependency tree exactly: `ENV_HASH` identifies the environment that
      # compiles it, while `TASKFILE_HASH` covers the definitions (versions, URLs, and CMake flags)
      # that describe it. Linux callers resolve the platform image before restoring the cache so
      # mutable base-image tags and unversioned OS packages cannot reuse an incompatible tree.
      #
      # The callers deliberately pass no `restore-keys`, so a key that doesn't match exactly is a
      # miss and the tree is rebuilt from scratch. `restore-keys` would instead fall back to the
      # newest entry sharing a prefix, which after a dependency bump means unpacking a
      # `build/deps/cpp` built from the *previous* versions and running `task deps:core` on top of
      # it. That only ever adds to the tree: the new version is downloaded, rebuilt, and installed
      # over the old one, but `cmake --install` doesn't remove what the old one left behind, so
      # headers and libraries that the bump deleted or renamed survive in the install prefixes and
      # the core build can still find them. The result is a tree that matches neither version, and
      # nothing downstream would flag it.
      #
      # The cost of matching exactly is that a dependency bump pays for a full rebuild -- which is
      # what every run pays today -- so the worst case is a slow run rather than a wrong binary.
      env:
        TASKFILE_HASH: >-
          ${{hashFiles(
            'taskfile.yaml',
            'taskfiles/deps/**/*.yaml',
            'tools/yscope-dev-utils/exports/taskfiles/**/*.yaml'
          )}}
        INPUT_ENV_HASH: "${{inputs.env_hash}}"
      run: |
        env_hash="${INPUT_ENV_HASH#sha256:}"

        if [[ ! "${env_hash}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::deps-cache-key: env_hash must be a SHA-256 value" >&2
          exit 1
        fi
        # `hashFiles` returns an empty string when nothing matches. Fail rather than let unrelated
        # dependency definitions share a key.
        if [[ -z "${TASKFILE_HASH}" ]] ; then
          echo "::error::deps-cache-key: no dependency definition files matched" >&2
          exit 1
        fi

        echo "key=deps-core-${{inputs.arch}}-${{inputs.os_name}}-${env_hash}-${TASKFILE_HASH}" \
          >> "$GITHUB_OUTPUT"
