name: "clp-webui-generated-code-checks"

on:
  pull_request:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  api-client-schema-committed:
    permissions:
      contents: "read"
    # Runs only on Ubuntu Jammy (22.04) since the Rust components are only built on this platform.
    runs-on: "ubuntu-22.04"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
        with:
          persist-credentials: false
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.48.0"

      - name: "Generate the api-client schema"
        shell: "bash"
        run: "task codegen:webui-generate-api-client-schema"

      - name: "Check if the generated schema is the latest"
        shell: "bash"
        run: |-
          schema_path="components/webui/packages/api-client/src/schema.ts"
          stale_files="$(git status --porcelain "${schema_path}")"
          if [[ -n "${stale_files}" ]]; then
            echo >&2 "ERROR: The following generated files are out of date:"
            echo >&2 "${stale_files}"
            echo >&2 ""
            echo >&2 "Please run 'task codegen:webui-generate-api-client-schema' locally and" \
              "commit the updated files."
            git diff >&2 "${schema_path}"
            exit 1
          fi
