{{- if and .Values.clpConfig.presto (has "presto" .Values.clpConfig.bundled) }}
apiVersion: "v1"
kind: "Secret"
metadata:
  name: {{ include "clp.fullname" . }}-presto-catalog
  labels:
    {{- include "clp.labels" . | nindent 4 }}
    app.kubernetes.io/component: "presto"
type: "Opaque"
stringData:
  presto-coordinator-catalog-clp.properties: |
    connector.name=clp
    clp.metadata-provider-type=mysql
    {{- $databaseHost := include "clp.databaseHost" . }}
    {{- $databasePort := include "clp.databasePort" . }}
    {{- $databaseName := .Values.clpConfig.database.names.clp }}
    clp.metadata-db-url=jdbc:mysql://{{ $databaseHost }}:{{ $databasePort }}
    clp.metadata-db-name={{ include "clp.javaPropertiesValue" $databaseName }}
    {{- with .Values.credentials.database }}
    clp.metadata-db-user={{ include "clp.javaPropertiesValue" .username }}
    clp.metadata-db-password={{ include "clp.javaPropertiesValue" .password }}
    {{- end }}
    clp.metadata-table-prefix=clp_
    clp.split-provider-type=mysql
    clp.split-filter-provider-type=mysql
    clp.split-filter-config=/opt/presto-server/etc/split-filter.json

  presto-worker-catalog-clp.properties: |
    connector.name=clp
    {{- with .Values.clpConfig.archive_output.storage }}
    {{- if eq .type "s3" }}
    {{- $s3Config := .s3_config }}
    {{- $authType := $s3Config.aws_authentication.type }}
    clp.storage-type=s3
    {{- if eq $authType "default" }}
    {{- /* The worker gets credentials from the AWS default credential provider chain. */}}
    clp.s3-auth-provider=default
    {{- else if eq $authType "credentials" }}
    {{- $credentials := $s3Config.aws_authentication.credentials | default dict }}
    clp.s3-auth-provider=clp_package
    clp.s3-access-key-id={{ required
      "Presto requires the archive output's S3 access_key_id."
      $credentials.access_key_id }}
    clp.s3-secret-access-key={{ required
      "Presto requires the archive output's S3 secret_access_key."
      $credentials.secret_access_key }}
    {{- with $credentials.session_token }}
    clp.s3-session-token={{ . }}
    {{- end }}
    {{- else }}
    {{- fail (printf
      "Presto reads S3 archives with the %q or %q aws_authentication type, not %q."
      "default" "credentials" $authType) }}
    {{- end }}
    clp.s3-bucket={{ $s3Config.bucket }}
    {{- if $s3Config.endpoint_url }}
    clp.s3-end-point={{ trimSuffix "/" $s3Config.endpoint_url }}
    {{- else if $s3Config.region_code }}
    clp.s3-end-point=https://s3.{{ $s3Config.region_code }}.amazonaws.com
    {{- else }}
    {{- fail "Presto requires archive_output.storage.s3_config.region_code or endpoint_url." }}
    {{- end }}
    {{- end }}{{/* if eq .type "s3" */}}
    {{- end }}{{/* with .Values.clpConfig.archive_output.storage */}}
{{- end }}
