{{- if has "results_cache" .Values.clpConfig.bundled }}
apiVersion: "v1"
kind: "Service"
metadata:
  name: {{ include "clp.fullname" . }}-results-cache
  labels:
    {{- include "clp.labels" . | nindent 4 }}
    app.kubernetes.io/component: "results-cache"
spec:
  {{- if .Values.allowHostAccessForSbinScripts }}
  type: "NodePort"
  {{- else }}
  clusterIP: "None"
  {{- end }}
  # Publish the pod's address before it is Ready so this Service's DNS name resolves during init:
  # otherwise the `results-cache-init` sidecar can't advertise a resolvable member host (the name
  # resolves only once the pod is Ready, which itself waits for that sidecar) -- a deadlock.
  publishNotReadyAddresses: true
  selector:
    {{- include "clp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: "results-cache"
  ports:
    - port: 27017
      targetPort: "results-cache"
      {{- if .Values.allowHostAccessForSbinScripts }}
      nodePort: {{ .Values.clpConfig.results_cache.port }}
      {{- end }}
{{- end }}
