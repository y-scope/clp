{{- if .Values.httpRoute.enabled }}
{{- if eq (len .Values.httpRoute.parentRefs) 0 }}
{{- fail
  "httpRoute.parentRefs must contain at least one Gateway reference when httpRoute.enabled is true"
}}
{{- end }}
apiVersion: "gateway.networking.k8s.io/v1"
kind: "HTTPRoute"
metadata:
  name: {{ include "clp.fullname" . }}-webui
  labels:
    {{- include "clp.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: "PathPrefix"
            value: "/"
      backendRefs:
        - name: {{ include "clp.fullname" . }}-webui
          port: 4000
{{- end }}
