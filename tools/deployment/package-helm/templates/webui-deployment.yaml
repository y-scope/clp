{{- if not .Values.clpConfig.api_server }}
{{- fail "clpConfig.api_server is required when the Web UI is deployed: the Web UI reads all metadata through the API server." }}
{{- end }}
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: {{ include "clp.fullname" . }}-webui
  labels:
    {{- include "clp.labels" . | nindent 4 }}
    app.kubernetes.io/component: "webui"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "clp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: "webui"
  template:
    metadata:
      labels:
        {{- include "clp.labels" . | nindent 8 }}
        app.kubernetes.io/component: "webui"
    spec:
      {{- include "clp.createSchedulingConfigs" (dict
          "root" .
          "component" "webui"
        ) | nindent 6 }}
      serviceAccountName: {{ include "clp.fullname" . }}-service-account
      terminationGracePeriodSeconds: 60
      initContainers:
        - {{- include "clp.waitFor" (dict
            "root" .
            "type" "job"
            "name" "db-table-creator"
          ) | nindent 10 }}
        - {{- include "clp.waitForResultsCache" . | nindent 10 }}
      containers:
        - name: "webui"
          image: {{ include "clp.imageRef" (dict "root" . "component" "clpPackage") | quote }}
          imagePullPolicy: "{{ .Values.image.clpPackage.pullPolicy }}"
          env:
            - name: "HOST"
              value: "0.0.0.0"
            - name: "NODE_ENV"
              value: "production"
            - name: "NODE_PATH"
              value: "/opt/clp/var/www/webui/server/node_modules"
            - name: "PORT"
              value: "4000"
            - name: "RATE_LIMIT"
              value: {{ .Values.clpConfig.webui.rate_limit | quote }}
          {{- include "clp.createResourceLimits" (dict
              "root" .
              "component" "webui"
            ) | nindent 10 }}
          ports:
            - name: "webui"
              containerPort: 4000
          volumeMounts:
            - name: "webui-settings"
              mountPath: "/opt/clp/etc/webui/settings.json"
              subPath: "webui-settings.json"
              readOnly: true
            {{- if eq .Values.clpConfig.stream_output.storage.type "fs" }}
            - name: {{ include "clp.volumeName" (dict
                "component_category" "shared-data"
                "name" "streams"
              ) | quote }}
              mountPath: "/var/data/streams"
            {{- end }}
          command: [
            "/opt/clp/bin/node",
            "/opt/clp/var/www/webui/server/dist/main.js"
          ]
          readinessProbe:
            {{- include "clp.readinessProbeTimings" . | nindent 12 }}
            httpGet: &webui-health-check
              path: "/"
              port: "webui"
          livenessProbe:
            {{- include "clp.livenessProbeTimings" . | nindent 12 }}
            httpGet: *webui-health-check
      volumes:
        - name: "webui-settings"
          configMap:
            name: {{ include "clp.fullname" . }}-config
        {{- if eq .Values.clpConfig.stream_output.storage.type "fs" }}
        - {{- include "clp.pvcVolume" (dict
            "root" .
            "component_category" "shared-data"
            "name" "streams"
          ) | nindent 10 }}
        {{- end }}
