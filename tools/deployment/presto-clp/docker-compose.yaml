services:
  clp-plugin-presto-connector-init:
    # One-shot: installs the CLP Presto connector plugin into shared volumes that the
    # coordinator and worker mount into their plugin dirs (replacing the connector-baked
    # Presto images). The connector image's own entrypoint does the install; we only supply
    # the target paths via *_PLUGIN_INSTALL_PATH.
    # init.py verifies the image exists (locally or on the registry) and writes the resolved
    # reference into .env as CLP_PRESTO_CONNECTOR_REF, which may be repository:tag,
    # repository@digest, or repository:tag@digest. Locally-built and published images share the
    # same :<version> tag; whatever is in the local daemon wins. The default below is only used
    # when .env is absent.
    image: "${CLP_PRESTO_CONNECTOR_REF:-\
      ghcr.io/y-scope/clp-plugin-presto-connector:0.1.0-SNAPSHOT@sha256:d006b0ce7830b6932eea66f1edc8dedbc54dbd661943eb38147e62c847fe0c32}"
    restart: "no"
    environment:
      COORDINATOR_PLUGIN_INSTALL_PATH: "/install/coordinator"
      WORKER_PLUGIN_INSTALL_PATH: "/install/worker"
    volumes:
      - "coordinator-plugin:/install/coordinator"
      - "worker-plugin:/install/worker"
    networks:
      - "clp-package"

  presto-coordinator:
    # Pinned by digest so the image can't change under us; the tag is kept as a
    # human-readable label. Override with a full reference.
    image: "${CLP_PRESTO_COORDINATOR_REF:-\
      ghcr.io/y-scope/presto:0.299@sha256:87e9ce10a1184f1b5ce0dd74591ef753c3afe763d860ef412a331684ec653753}"
    entrypoint: ["/bin/bash", "-c", "/scripts/generate-configs.sh && /opt/entrypoint.sh"]
    depends_on:
      clp-plugin-presto-connector-init:
        condition: "service_completed_successfully"
    env_file:
      - ".env"
      - "coordinator-common.env"
      - "coordinator.env"
    volumes:
      - "./coordinator/config-template:/configs:ro"
      - "./coordinator/scripts:/scripts:ro"
      - type: "tmpfs"
        target: "/opt/presto-server/etc"
      - "coordinator-plugin:/opt/presto-server/plugin/clp"
    networks:
      - "clp-package"
    ports:
      - "8889:8080"
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "${PRESTO_COORDINATOR_CONFIGPROPERTIES_DISCOVERY_URI}/v1/info"
      interval: "10s"
      retries: 30

  presto-worker:
    # Pinned by digest; see the coordinator's image above.
    image: "${CLP_PRESTO_WORKER_REF:-\
      ghcr.io/y-scope/presto-native:0.299@sha256:8f9ca4ba7dd844385b85e7e3bd9568128096e2a7ad09432c6a982ea11279a13b}"
    depends_on:
      presto-coordinator:
        condition: "service_healthy"
      clp-plugin-presto-connector-init:
        condition: "service_completed_successfully"
    entrypoint: ["/bin/bash", "-c", "/scripts/generate-configs.sh && /opt/entrypoint.sh"]
    env_file:
      - ".env"
      - "coordinator-common.env"
      - "worker.env"
    volumes:
      - "${CLP_ARCHIVES_DIR:-empty}:/var/data/archives:ro"
      - "${CLP_STAGED_ARCHIVES_DIR:-empty}:/var/data/staged-archives:ro"
      - "./worker/config-template:/configs:ro"
      - "./worker/scripts:/scripts:ro"
      - type: "tmpfs"
        target: "/opt/presto-server/etc"
      - "worker-plugin:/opt/presto-server/plugin/clp"
    networks:
      - "clp-package"

volumes:
  # Dummy volume to use when a bind mount is not desired.
  empty:

  # Populated by clp-plugin-presto-connector-init; mounted into the coordinator/worker
  # plugin directories.
  coordinator-plugin:
  worker-plugin:

networks:
  clp-package:
    name: "${CLP_PACKAGE_NETWORK_NAME:-clp-package_default}"
    external: true
