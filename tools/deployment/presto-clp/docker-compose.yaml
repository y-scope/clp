services:
  clp-plugin-presto-connector-init:
    # One-shot: installs the CLP Presto connector plugin into shared volumes that the
    # coordinator and worker mount into their plugin dirs (replacing the connector-baked
    # Presto images). The connector image's own entrypoint does the install; we only supply
    # the target paths via *_PLUGIN_INSTALL_PATH.
    # TODO: default CLP_CONNECTOR_TAG to the released multi-arch tag before merging.
    image: "${CLP_CONNECTOR_IMAGE:-\
      ghcr.io/y-scope/clp-plugin-presto-connector}:${CLP_CONNECTOR_TAG:-\
      0.1.0-SNAPSHOT-arm64}"
    restart: "no"
    environment:
      COORDINATOR_PLUGIN_INSTALL_PATH: "/install/coordinator"
      WORKER_PLUGIN_INSTALL_PATH: "/install/worker"
    volumes:
      - "coordinator-plugin:/install/coordinator"
      - "worker-plugin:/install/worker"
    networks:
      - "clp-package"

  presto-coordinator:
    image: "ghcr.io/y-scope/presto:${CLP_PRESTO_COORDINATOR_IMAGE_TAG:-0.299}"
    entrypoint: ["/bin/bash", "-c", "/scripts/generate-configs.sh && /opt/entrypoint.sh"]
    depends_on:
      clp-plugin-presto-connector-init:
        condition: "service_completed_successfully"
    env_file:
      - ".env"
      - "coordinator-common.env"
      - "coordinator.env"
    volumes:
      - "./coordinator/config-template:/configs:ro"
      - "./coordinator/scripts:/scripts:ro"
      - type: "tmpfs"
        target: "/opt/presto-server/etc"
      - "coordinator-plugin:/opt/presto-server/plugin/clp"
    networks:
      - "clp-package"
    ports:
      - "8889:8080"
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "${PRESTO_COORDINATOR_CONFIGPROPERTIES_DISCOVERY_URI}/v1/info"
      interval: "10s"
      retries: 30

  presto-worker:
    image: "ghcr.io/y-scope/presto-native:${CLP_PRESTO_WORKER_IMAGE_TAG:-0.299}"
    depends_on:
      presto-coordinator:
        condition: "service_healthy"
      clp-plugin-presto-connector-init:
        condition: "service_completed_successfully"
    entrypoint: ["/bin/bash", "-c", "/scripts/generate-configs.sh && /opt/entrypoint.sh"]
    env_file:
      - ".env"
      - "coordinator-common.env"
      - "worker.env"
    volumes:
      - "${CLP_ARCHIVES_DIR:-empty}:/var/data/archives:ro"
      - "${CLP_STAGED_ARCHIVES_DIR:-empty}:/var/data/staged-archives:ro"
      - "./worker/config-template:/configs:ro"
      - "./worker/scripts:/scripts:ro"
      - type: "tmpfs"
        target: "/opt/presto-server/etc"
      - "worker-plugin:/opt/presto-server/plugin/clp"
    networks:
      - "clp-package"

volumes:
  # Dummy volume to use when a bind mount is not desired.
  empty:

  # Populated by clp-plugin-presto-connector-init; mounted into the coordinator/worker
  # plugin directories.
  coordinator-plugin:
  worker-plugin:

networks:
  clp-package:
    name: "${CLP_PACKAGE_NETWORK_NAME:-clp-package_default}"
    external: true
