name: "clp-package-all"

# Common service defaults.
x-service-defaults: &service_defaults
  image: "${CLP_PACKAGE_CONTAINER_IMAGE_REF:-clp-package}"
  logging:
    driver: "local"
  stop_grace_period: "60s"
  user: "${CLP_FIRST_PARTY_SERVICE_UID_GID:-1000:1000}"
  restart: "${CLP_RESTART_POLICY:-on-failure:3}"
  extra_hosts:
    - "${CLP_EXTRA_HOST_DATABASE_NAME:-noop-db}=${CLP_EXTRA_HOST_DATABASE_ADDR:-127.0.0.2}"
    - "${CLP_EXTRA_HOST_RESULTS_CACHE_NAME:-noop-rc}=\
      ${CLP_EXTRA_HOST_RESULTS_CACHE_ADDR:-127.0.0.2}"
    - "${CLP_EXTRA_HOST_OTEL_COLLECTOR_NAME:-noop-otel}=\
      ${CLP_EXTRA_HOST_OTEL_COLLECTOR_ADDR:-127.0.0.2}"

# Common healthcheck defaults.
x-healthcheck-defaults: &healthcheck_defaults
  # Avoid lowering to prevent excessive resource usage.
  interval: "30s"

  # Mark unhealthy after 3 failed probes.
  # - In steady state, (<interval> + <timeout>) × 3 = ~90s before the service is marked unhealthy.
  # - From startup, <start_period> (60s) + ~90s = ~150s before the service is marked unhealthy.
  retries: 3

  # Frequent checks during startup allow fast transition to healthy.
  start_interval: "2s"

  # Ignore failures for <start_period> / (<start_interval> + <timeout>) = ~15 frequent checks before
  # counting retries.
  start_period: "60s"

  # Short timeout since no remote communication is expected.
  timeout: "2s"

# Common telemetry environment defaults for CLP services.
x-clp-telemetry-env-defaults: &clp_telemetry_env_defaults
  CLP_DISABLE_TELEMETRY: "${CLP_DISABLE_TELEMETRY:-false}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:\
    ${CLP_OTEL_COLLECTOR_CONNECT_PORT:-4318}}"

# Common volume definitions.
x-volume-definitions:
  clp-config-readonly: &volume_clp_config_readonly
    type: "bind"
    source: "${CLP_LOGS_DIR_HOST:-./var/log}/.clp-config.yaml"
    target: "/etc/clp-config.yaml"
    read_only: true
  clp-logs: &volume_clp_logs
    type: "bind"
    source: "${CLP_LOGS_DIR_HOST:-./var/log}"
    target: "/var/log"
  clp-tmp: &volume_clp_tmp
    type: "bind"
    source: "${CLP_TMP_DIR_HOST:-./var/tmp}"
    target: "/var/tmp"

services:
  database:
    <<: *service_defaults
    image: "${CLP_DB_CONTAINER_IMAGE_REF:-mariadb:10.11.16}"
    hostname: "database"
    deploy:
      # Value must be either 0 or 1. Set to 0 to disable the database.
      replicas: "${CLP_DATABASE_ENABLED:-1}"
    user: "${CLP_THIRD_PARTY_SERVICE_UID_GID:-1000:1000}"
    environment:
      MYSQL_DATABASE: "${CLP_DB_NAME:-clp-db}"
      MYSQL_PASSWORD: "${CLP_DB_PASS:?Please set a value.}"
      MYSQL_ROOT_PASSWORD: "${CLP_DB_ROOT_PASS:?Please set a value.}"
      MYSQL_USER: "${CLP_DB_USER:-clp-user}"
    ports:
      - host_ip: "${CLP_DB_HOST:-127.0.0.1}"
        published: "${CLP_DB_PORT:-3306}"
        target: 3306
    volumes:
      - type: "bind"
        source: "${CLP_DB_CONF_LOGGING_FILE_HOST:-./etc/mysql/conf.d/logging.cnf}"
        target: "/etc/mysql/conf.d/logging.cnf"
        read_only: true
      - type: "bind"
        source: "${CLP_DB_DATA_DIR_HOST:-./var/data/database}"
        target: "/var/lib/mysql"
      - type: "bind"
        source: "${CLP_DB_LOGS_DIR_HOST:-./var/log/database}"
        target: "/var/log/mysql"
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "mysqladmin", "ping",
        "--silent",
        "-h", "127.0.0.1",
        "-u", "${CLP_DB_USER:-clp-user}",
        "--password=${CLP_DB_PASS:?Please set a value.}"
      ]

  db-table-creator:
    <<: *service_defaults
    restart: "on-failure:3"
    hostname: "db_table_creator"
    environment:
      CLP_DB_PASS: "${CLP_DB_PASS:?Please set a value.}"
      CLP_DB_ROOT_PASS: "${CLP_DB_ROOT_PASS:?Please set a value.}"
      CLP_DB_ROOT_USER: "${CLP_DB_ROOT_USER:-root}"
      CLP_DB_USER: "${CLP_DB_USER:-clp-user}"
      PYTHONPATH: "/opt/clp/lib/python3/site-packages"
    volumes:
      - *volume_clp_config_readonly
    depends_on:
      database:
        condition: "service_healthy"
    command: [
      "python3",
      "-u",
      "-m", "clp_py_utils.create-db-tables",
      "--config", "/etc/clp-config.yaml",
      "--storage-engine", "${CLP_PACKAGE_STORAGE_ENGINE:-clp}",
    ]

  results-cache:
    <<: *service_defaults
    image: "mongo:9.0.4"
    hostname: "results_cache"
    deploy:
      # Value must be either 0 or 1. Set to 0 to disable the results cache.
      replicas: "${CLP_RESULTS_CACHE_ENABLED:-1}"
    user: "${CLP_THIRD_PARTY_SERVICE_UID_GID:-1000:1000}"
    ports:
      - host_ip: "${CLP_RESULTS_CACHE_HOST:-127.0.0.1}"
        published: "${CLP_RESULTS_CACHE_PORT:-27017}"
        target: 27017
    volumes:
      - type: "bind"
        source: "${CLP_RESULTS_CACHE_CONF_FILE_HOST:-./etc/mongo/mongod.conf}"
        target: "/etc/mongo/mongod.conf"
        read_only: true
      - type: "bind"
        source: "${CLP_RESULTS_CACHE_DATA_DIR_HOST:-./var/data/results_cache}"
        target: "/data/db"
      - type: "bind"
        source: "${CLP_RESULTS_CACHE_LOGS_DIR_HOST:-./var/log/results_cache}"
        target: "/var/log/mongodb"
    command: [
      "--config", "/etc/mongo/mongod.conf",
      "--bind_ip", "0.0.0.0",
    ]
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "mongosh",
        "127.0.0.1:27017/test",
        "--quiet",
        "--eval", "db.runCommand('ping').ok"
      ]

  results-cache-indices-creator:
    <<: *service_defaults
    restart: "on-failure:3"
    hostname: "results_cache_indices_creator"
    environment:
      PYTHONPATH: "/opt/clp/lib/python3/site-packages"
    depends_on:
      results-cache:
        condition: "service_healthy"
    command: [
      "python3",
      "-u",
      "-m", "clp_py_utils.initialize-results-cache",
      "--uri", "mongodb://${CLP_EXTRA_HOST_RESULTS_CACHE_ADDR:-results_cache}\
        :${CLP_RESULTS_CACHE_CONNECT_PORT:-27017}/${CLP_RESULTS_CACHE_DB_NAME:-clp-query-results}",
      "--stream-collection", "${CLP_RESULTS_CACHE_STREAM_COLLECTION_NAME:-stream-files}",
    ]

  compression-coordinator:
    <<: *service_defaults
    hostname: "compression_coordinator"
    environment:
      <<: *clp_telemetry_env_defaults
      CLP_DB_PASS: "${CLP_DB_PASS:?Please set a value.}"
      CLP_DB_USER: "${CLP_DB_USER:-clp-user}"
      OTEL_SERVICE_NAME: "compression-coordinator"
      RUST_LOG: "${CLP_COMPRESSION_COORDINATOR_LOGGING_LEVEL:-INFO}"
    volumes:
      - *volume_clp_config_readonly
      - "${CLP_LOGS_INPUT_DIR_HOST:-empty}:${CLP_LOGS_INPUT_DIR_CONTAINER:-/mnt/logs}:ro"
    depends_on:
      db-table-creator:
        condition: "service_completed_successfully"
      spider-storage:
        condition: "service_healthy"
    command: [
      "/opt/clp/bin/compression-coordinator",
      "--config", "/etc/clp-config.yaml"
    ]

  webui:
    <<: *service_defaults
    hostname: "webui"
    environment:
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      NODE_PATH: "/opt/clp/var/www/webui/server/node_modules"
      PORT: "4000"
      RATE_LIMIT: "${CLP_WEBUI_RATE_LIMIT:-1000}"
    ports:
      - host_ip: "${CLP_WEBUI_HOST:-127.0.0.1}"
        published: "${CLP_WEBUI_PORT:-4000}"
        target: 4000
    volumes:
      - "${CLP_STREAM_OUTPUT_DIR_HOST:-empty}:/var/data/streams:ro"
      - type: "bind"
        source: "./etc/webui/settings.json"
        target: "/opt/clp/etc/webui/settings.json"
        read_only: true
    depends_on:
      db-table-creator:
        condition: "service_completed_successfully"
      results-cache-indices-creator:
        condition: "service_completed_successfully"
    command: [
      "/opt/clp/bin/node",
      "/opt/clp/var/www/webui/server/dist/main.js"
    ]
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "curl",
        "-f",
        "http://webui:4000/"
      ]

  garbage-collector:
    <<: *service_defaults
    hostname: "garbage_collector"
    stop_grace_period: "10s"
    deploy:
      # Value must be either 0 or 1. Set to 0 to disable the garbage collector.
      replicas: "${CLP_GARBAGE_COLLECTOR_ENABLED:-1}"
    environment:
      CLP_DB_PASS: "${CLP_DB_PASS:?Please set a value.}"
      CLP_DB_USER: "${CLP_DB_USER:-clp-user}"
      CLP_HOME: "/opt/clp"
      CLP_LOGGING_LEVEL: "${CLP_GARBAGE_COLLECTOR_LOGGING_LEVEL:-INFO}"
      CLP_LOGS_DIR: "/var/log/garbage_collector"
      PYTHONPATH: "/opt/clp/lib/python3/site-packages"
    volumes:
      - *volume_clp_config_readonly
      - *volume_clp_logs
      - *volume_clp_tmp
      - "${CLP_ARCHIVE_OUTPUT_DIR_HOST:-empty}:/var/data/archives"
      - "${CLP_AWS_CONFIG_DIR_HOST:-empty}:/opt/clp/.aws:ro"
      - "${CLP_STREAM_OUTPUT_DIR_HOST:-empty}:/var/data/streams"
    depends_on:
      db-table-creator:
        condition: "service_completed_successfully"
      results-cache-indices-creator:
        condition: "service_completed_successfully"
    command: [
      "python3", "-u",
      "-m", "job_orchestration.garbage_collector.garbage_collector",
      "--config", "/etc/clp-config.yaml",
    ]

  query-coordinator:
    <<: *service_defaults
    hostname: "query_coordinator"
    environment:
      <<: *clp_telemetry_env_defaults
      CLP_DB_PASS: "${CLP_DB_PASS:?Please set a value.}"
      CLP_DB_USER: "${CLP_DB_USER:-clp-user}"
      OTEL_SERVICE_NAME: "query-coordinator"
      RUST_LOG: "${CLP_QUERY_COORDINATOR_LOGGING_LEVEL:-INFO}"
    volumes:
      - *volume_clp_config_readonly
    depends_on:
      db-table-creator:
        condition: "service_completed_successfully"
      results-cache-indices-creator:
        condition: "service_completed_successfully"
      spider-storage:
        condition: "service_healthy"
    command: [
      "/opt/clp/bin/query-coordinator",
      "--config", "/etc/clp-config.yaml"
    ]

  mcp-server:
    <<: *service_defaults
    hostname: "mcp_server"
    deploy:
      # Value must be either 0 or 1. Set to 0 to disable the MCP server.
      replicas: "${CLP_MCP_SERVER_ENABLED:-0}"
    environment:
      CLP_LOGGING_LEVEL: "${CLP_MCP_LOGGING_LEVEL:-INFO}"
      CLP_LOGS_DIR: "/var/log/mcp_server"
      CLP_DB_PASS: "${CLP_DB_PASS:?Please set a value.}"
      CLP_DB_USER: "${CLP_DB_USER:-clp-user}"
      PYTHONPATH: "/opt/clp/lib/python3/site-packages"
    ports:
      - host_ip: "${CLP_MCP_HOST:-127.0.0.1}"
        published: "${CLP_MCP_PORT:-8000}"
        target: 8000
    volumes:
      - *volume_clp_config_readonly
      - *volume_clp_logs
    depends_on:
      db-table-creator:
        condition: "service_completed_successfully"
      results-cache-indices-creator:
        condition: "service_completed_successfully"
    command: [
      "python3", "-u",
      "-m", "clp_mcp_server.clp_mcp_server",
      "--host", "mcp_server",
      "--port", "8000",
      "--config-path", "/etc/clp-config.yaml",
    ]
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "curl",
        "-f",
        "http://mcp_server:8000/health"
      ]

  api-server:
    <<: *service_defaults
    hostname: "api_server"
    deploy:
      # Value must be either 0 or 1. Set to 0 to disable the API server.
      replicas: "${CLP_API_SERVER_ENABLED:-1}"
    environment:
      <<: *clp_telemetry_env_defaults
      CLP_LOGS_DIR: "/var/log/api_server"
      CLP_DB_PASS: "${CLP_DB_PASS:?Please set a value.}"
      CLP_DB_USER: "${CLP_DB_USER:-clp-user}"
      OTEL_SERVICE_NAME: "api-server"
      RUST_LOG: "INFO"
    ports:
      - host_ip: "${CLP_API_SERVER_HOST:-127.0.0.1}"
        published: "${CLP_API_SERVER_PORT:-3001}"
        target: 3001
    volumes:
      - *volume_clp_config_readonly
      - *volume_clp_logs
      - "${CLP_AWS_CONFIG_DIR_HOST:-empty}:/opt/clp/.aws:ro"
      - "${CLP_LOGS_INPUT_DIR_HOST:-empty}:${CLP_LOGS_INPUT_DIR_CONTAINER:-/mnt/logs}:ro"
      - "${CLP_STREAM_OUTPUT_DIR_HOST:-empty}:/var/data/streams"
    depends_on:
      db-table-creator:
        condition: "service_completed_successfully"
      results-cache-indices-creator:
        condition: "service_completed_successfully"
    command: [
      "/opt/clp/bin/api_server",
      "--host", "0.0.0.0",
      "--port", "3001",
      "--config", "/etc/clp-config.yaml"
    ]
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "curl",
        "-f",
        "http://api_server:3001/health"
      ]

  log-ingestor:
    <<: *service_defaults
    hostname: "log_ingestor"
    deploy:
      # Value must be either 0 or 1. Set to 0 to disable log-ingestor.
      replicas: "${CLP_LOG_INGESTOR_ENABLED:-1}"
    environment:
      <<: *clp_telemetry_env_defaults
      CLP_LOGS_DIR: "/var/log/log_ingestor"
      CLP_DB_PASS: "${CLP_DB_PASS:?Please set a value.}"
      CLP_DB_USER: "${CLP_DB_USER:-clp-user}"
      OTEL_SERVICE_NAME: "log-ingestor"
      RUST_LOG: "${CLP_LOG_INGESTOR_LOGGING_LEVEL:-INFO}"
    ports:
      - host_ip: "${CLP_LOG_INGESTOR_HOST:-127.0.0.1}"
        published: "${CLP_LOG_INGESTOR_PORT:-3002}"
        target: 3002
    volumes:
      - *volume_clp_config_readonly
      - *volume_clp_logs
    depends_on:
      db-table-creator:
        condition: "service_completed_successfully"
    command: [
      "/opt/clp/bin/log-ingestor",
      "--config", "/etc/clp-config.yaml",
      "--host", "0.0.0.0",
      "--port", "3002"
    ]
    healthcheck:
      <<: *healthcheck_defaults
      test: [
        "CMD",
        "curl",
        "-f",
        "http://log_ingestor:3002/health"
      ]

  otel-collector:
    # NOTE: health check cannot be done easily without a custom image with HTTP utils like curl.
    <<: *service_defaults
    image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.152.0" # yamllint disable-line
    deploy:
      # Value must be either 0 or 1. Set to 0 to disable the otel collector.
      replicas: "${CLP_OTEL_COLLECTOR_ENABLED:-1}"
    user: "${CLP_THIRD_PARTY_SERVICE_UID_GID:-1000:1000}"
    group_add:
      - "${CLP_DOCKER_GID:-999}"
    environment:
      CLP_TELEMETRY_ENDPOINT: "${CLP_TELEMETRY_ENDPOINT:-https://telemetry.yscope.io}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-}"
    ports:
      - host_ip: "${CLP_OTEL_COLLECTOR_HOST:-127.0.0.1}"
        published: "${CLP_OTEL_COLLECTOR_PORT:-4318}"
        target: 4318
    volumes:
      - type: "bind"
        source: "${CLP_OTEL_COLLECTOR_CONF_FILE_HOST:-./etc/otel-collector/config.yaml}"
        target: "/etc/otelcol-contrib/config.yaml"
        read_only: true
      - type: "bind"
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
