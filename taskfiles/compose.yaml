version: "3"

includes:
  toolchains: "toolchains.yaml"
  utils: "../tools/yscope-dev-utils/exports/taskfiles/utils/utils.yaml"

vars:
  G_SPIDER_COMPOSE_BUILD_DIR: "{{.G_BUILD_DIR}}/spider-compose"
  G_SPIDER_COMPOSE_CHECKSUM_FILE: "{{.G_BUILD_DIR}}/spider-compose.md5"
  G_SPIDER_COMPOSE_TASKFILE: "{{.ROOT_DIR}}/taskfiles/compose.yaml"

  # TODO: Spider doesn't tag releases of its Compose deployment yet, so we pin the artifact by
  # digest rather than by version. Switch to a version tag once Spider publishes one.
  G_SPIDER_COMPOSE_IMAGE_REF: >-
    ghcr.io/y-scope/spider/compose@sha256:3f35254027f1c577b25c68c2f08bb17abb03fb4467aafc3012cc540d2c29ef76

tasks:
  # Downloads Spider's Docker Compose deployment from the OCI artifact that Spider publishes.
  download-spider:
    run: "once"
    vars:
      CHECKSUM_FILE: "{{.G_SPIDER_COMPOSE_CHECKSUM_FILE}}"
      OUTPUT_DIR: "{{.G_SPIDER_COMPOSE_BUILD_DIR}}"
    sources: ["{{.G_SPIDER_COMPOSE_TASKFILE}}"]
    generates: ["{{.CHECKSUM_FILE}}"]
    deps:
      - "toolchains:oras"
      - task: "utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
    cmds:
      - "rm -rf '{{.OUTPUT_DIR}}'"
      # The artifact's layers are titled `spider-compose/*`, so pulling into the build directory
      # recreates `{{.OUTPUT_DIR}}`.
      - >-
        "{{.G_ORAS_TOOLCHAIN_DIR}}/oras" pull
        "{{.G_SPIDER_COMPOSE_IMAGE_REF}}"
        --output "{{.G_BUILD_DIR}}"
      # This command must be last
      - task: "utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
