version: "3"

vars:
  G_DEPS_YSCOPE_LOG_VIEWER_SRC_DIR: "{{.G_WEBUI_SRC_DIR}}/packages/yscope-log-viewer"

tasks:
  default:
    deps: ["source"]

  source:
    internal: true
    run: "once"
    deps:
      - ":utils:init"
    cmds:
      - task: ":yscope-dev-utils:remote:download-and-extract-tar"
        vars:
          CHECKSUM_EXCLUDE_PATTERNS:
            - ".turbo"
            - "dist"
            - "node_modules"
          CHECKSUM_FILE: "{{.G_DEPS_DIR}}/yscope-log-viewer.md5"
          FILE_SHA256: "b5ddf8c9a18d8486ae33b2d1062f4dab9a5d5b17154792c85607e91e375b7289"
          OUTPUT_DIR: "{{.G_DEPS_YSCOPE_LOG_VIEWER_SRC_DIR}}"
          TAR_FILE: "{{.G_DEPS_DIR}}/yscope-log-viewer.tar.gz"
          URL: "https://github.com/y-scope/yscope-log-viewer/archive/20225d2.tar.gz"
